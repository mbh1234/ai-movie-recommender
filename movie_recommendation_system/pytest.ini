[tool:pytest]
# Pytest configuration for Movie Recommendation System - Milestone 2

# Test discovery
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output and verbosity
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=.
    --cov-branch
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --durations=10
    --disable-warnings
    --cov=.
    --cov-config=.coveragerc
    --cov-report=html:htmlcov
    --cov-report=term-missing

# Coverage configuration
[coverage:run]
source = .
omit = 
    */tests/*
    */test_*
    .venv/*
    venv/*
    __pycache__/*
    .pytest_cache/*
    htmlcov/*
    .git/*
    .tox/*
    reports/*
    models/*
    baseline_data/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

show_missing = True
skip_covered = False
skip_empty = True

[coverage:html]
directory = htmlcov
title = Movie Recommendation System - Test Coverage Report

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    slow: Tests that take longer to run
    performance: Performance and benchmarking tests
    quality: Data quality and validation tests
    model: Machine learning model tests
    pipeline: End-to-end pipeline tests

# Minimum version requirements
minversion = 6.0
